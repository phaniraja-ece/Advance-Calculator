name: Manual Native Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App Version'
        required: true
        default: '1.0.0'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 1. Install the packaging tools
      - name: Install Releaser Tools
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-releaser
          if ("${{ matrix.os }}" -eq "windows-latest") {
            choco install wix --version=4.0.2 -y
          }

      # 2. Build and Package (uses your TOML config)
      - name: Run Dotnet Releaser
        run: dotnet-releaser build .github/workflow-configs/dotnet-releaser-for-installer.toml

      # 3. Upload all generated installers
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: Installers-${{ matrix.rid }}
          path: output/*
